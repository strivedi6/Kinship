# Sends backend/Code.gs to Google Apps Script and publishes it as a new version
# of the same web app deployment (the app's link does not change).
# Runs when backend/Code.gs changes on main, or by hand from the Actions tab.
name: Deploy backend

on:
  push:
    branches: [main]
    paths: [backend/Code.gs]
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # The web app deployment the app talks to (the AKfyc... part of its /exec link).
      DEPLOYMENT_ID: AKfycbwdczETJa_ogzocppDe4Wzh7Mbuz95D9_I6tLVxyYLhc7QYu5dYVFeYo2eNlDYbf8rJ
      # The Kinship Apps Script project (Project Settings > Script ID). Not secret on its own: it needs the sign-in below to do anything.
      SCRIPT_ID: 1xYcZ9Tx8ms0vb1AFEwr6eSLExeUe9tEGYAWPIaWC_g38IS_adXECQZ8e
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install clasp
        run: npm install -g @google/clasp@2.4.2

      - name: Sign in (from the CLASPRC_JSON secret)
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC_JSON" ]; then echo "Add the CLASPRC_JSON secret first"; exit 1; fi
          printf '%s' "$CLASPRC_JSON" > ~/.clasprc.json
          chmod 600 ~/.clasprc.json

      - name: Point at the Kinship script
        run: |
          mkdir -p build
          printf '{"scriptId":"%s","rootDir":"build","fileExtension":"gs"}' "$SCRIPT_ID" > .clasp.json

      # Pull first so the project's own settings file (appsscript.json) and any other files stay as they are.
      - name: Pull the current project
        run: clasp pull

      - name: Replace Code.gs with the version in this repo
        run: |
          cp backend/Code.gs build/Code.gs
          ls -la build

      - name: Push and publish a new version
        run: |
          clasp push --force
          clasp deploy --deploymentId "$DEPLOYMENT_ID" --description "GitHub ${GITHUB_SHA::7}"

      - name: Clean up the sign-in file
        if: always()
        run: rm -f ~/.clasprc.json

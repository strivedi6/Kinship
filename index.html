<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Kinship</title>
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="" id="thmeta">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kinship">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
:root{--onacc:#fff;--accent:#0088FF;--page:#F2F2F7;--card:#FFFFFF;--side:#F2F2F7;--ink:#000;--muted:rgba(60,60,67,.6);--tert:rgba(60,60,67,.3);--fill:rgba(120,120,128,.16);--fill3:rgba(118,118,128,.12);--sep:rgba(60,60,67,.14);--glass:rgba(255,255,255,.74);--rim:#E8E8E8;--sel:#EDEDED;--sheet:rgba(242,242,247,.96);--orange:#C55300;--orange2:rgba(255,141,40,.16);--red:#FF383C;--green:#34C759;--grab:#CCC;color-scheme:light dark}
@media(prefers-color-scheme:dark){:root:not([data-th]){--accent:#0091FF;--page:#000;--card:#1C1C1E;--side:#1C1C1E;--ink:#FFF;--muted:rgba(235,235,245,.6);--tert:rgba(235,235,245,.3);--fill:rgba(120,120,128,.32);--fill3:rgba(118,118,128,.24);--sep:rgba(84,84,88,.6);--glass:rgba(44,44,46,.74);--rim:rgba(255,255,255,.14);--sel:rgba(255,255,255,.14);--sheet:rgba(28,28,30,.96);--orange:#FF9F45;--red:#FF4245;--grab:#5A5A5E}:root:not([data-th]) #sheet{--card:#2C2C2E}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
html{background:var(--page)}body{background:transparent;color:var(--ink);font:400 17px/22px -apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro","Helvetica Neue",system-ui,sans-serif;letter-spacing:-.43px;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
h1,h2,h3{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro","Helvetica Neue",system-ui,sans-serif}
h1{font-size:34px;line-height:41px;font-weight:700;letter-spacing:.4px}
h2{font-size:22px;line-height:28px;font-weight:700;letter-spacing:-.26px}
h3{font-size:17px;line-height:22px;font-weight:600;letter-spacing:-.43px}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
img{max-width:100%}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);box-shadow:0 0 0 .5px var(--rim),0 8px 24px rgba(0,0,0,.10)}
#app{max-width:760px;margin:0 auto;min-height:100%;padding:0 16px calc(110px + env(safe-area-inset-bottom))}
#app.wide{max-width:none;padding-left:0;padding-right:0}
.top{padding:calc(6px + env(safe-area-inset-top)) 0 10px}
#app.wide .top{padding-left:16px;padding-right:16px}
.top .bar{display:flex;justify-content:flex-end;align-items:center;min-height:44px;margin-bottom:8px}
.top .bar button{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.top .sub{font-size:15px;line-height:20px;color:var(--muted);letter-spacing:-.23px;margin-top:2px}
.card{background:var(--card);border-radius:26px;padding:16px;margin:12px 0}
button.card{display:flex}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}.small{font-size:13px;line-height:18px;letter-spacing:-.08px}.b{font-weight:600}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:28px 4px 6px}
.sec a,.link{color:var(--accent);font-weight:400;font-size:17px;text-decoration:none;cursor:pointer}
.small .link{font-size:13px}
.lrow{position:relative}.lrow+.lrow:before,.ev+.ev:before{content:"";position:absolute;left:48px;right:0;top:0;height:.5px;background:var(--sep)}
.lrow:after{content:"›";color:var(--tert);font-weight:600;font-size:20px;margin-left:4px}
.btn{background:var(--accent);color:var(--onacc);border-radius:1000px;min-height:50px;padding:0 20px;font-weight:600;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn.ghost{background:color-mix(in srgb,var(--accent) 15%,transparent);color:var(--accent)}
.btn.clay{background:var(--accent)}
.btn.line{background:var(--fill);color:var(--ink)}
.btn.sm{min-height:34px;padding:0 14px;font-size:15px;letter-spacing:-.23px}
.btn.block{display:flex;width:100%}
.btn:disabled{background:var(--fill);color:var(--tert)}
.btn:active,.chip:active,.habit:active,.opt:active{opacity:.6}
.av{border-radius:50%;object-fit:cover;flex:none;display:inline-flex;align-items:center;justify-content:center;font-weight:600;color:#fff;background:linear-gradient(#A9BCE1,#7983BE);overflow:hidden;letter-spacing:0}
.av.passed{filter:grayscale(1);opacity:.75}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--fill);color:var(--ink);border-radius:1000px;padding:6px 12px;font-weight:600;font-size:13px;line-height:18px;letter-spacing:-.08px;white-space:nowrap}
.chip.clay{background:var(--orange2);color:var(--orange)}
.chip.sel{background:var(--accent);color:var(--onacc)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.seg{display:flex;background:var(--fill3);border-radius:1000px;padding:2px;margin:6px 0 8px;height:36px}
.seg button{flex:1;border-radius:1000px;font-weight:500;font-size:14px;letter-spacing:-.15px}
.seg button.on{background:var(--card);font-weight:600;box-shadow:0 2px 6px rgba(0,0,0,.10),0 0 0 .5px var(--sep)}
@media(prefers-color-scheme:dark){:root:not([data-th]) .seg button.on{background:#636366}}
/* tab bar: floating glass capsule */
.nav{position:fixed;left:0;right:0;bottom:0;padding:16px 21px 21px;z-index:20;pointer-events:none;transition:padding .45s cubic-bezier(.32,.72,0,1)}
.nav div{max-width:360px;margin:0 auto;display:flex;padding:4px;border-radius:1000px;pointer-events:auto;transition:max-width .45s cubic-bezier(.32,.72,0,1)}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:6px 4px 7px;font-size:10px;line-height:12px;font-weight:600;letter-spacing:0;color:var(--ink);border-radius:100px}
.nav button.on{color:var(--accent);background:var(--sel)}
.nav svg,.srow svg{width:26px;height:28px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
/* sidebar (Mac / wide) */
#side{display:none}
@media(min-width:900px){
  :root:not([data-th]){--page:#FFFFFF}
  #side{display:flex;flex-direction:column;gap:8px;position:fixed;left:0;top:0;bottom:0;width:300px;background:var(--side);padding:24px 20px;z-index:20;overflow:auto;border-right:.5px solid var(--sep)}
  #side[hidden]{display:none}
  :root:not([data-th]) #app{--card:#F2F2F7}
  #app.shell{margin-left:300px;max-width:none;padding:8px 40px 60px}
  #app.shell>*{max-width:820px;margin-left:auto;margin-right:auto}
  #app.shell.wide{padding-left:0;padding-right:0}
  #app.shell.wide>*{max-width:none}
  #app.shell.wide .top,#app.shell.wide .treebar,#app.shell.wide .pad{padding-left:40px;padding-right:40px}
  .nav{display:none}
  .top .bar{display:none}.top{padding-top:28px}
  #sheetWrap.shell{left:300px}
}
@media(min-width:900px) and (prefers-color-scheme:dark){:root:not([data-th]){--page:#000}:root:not([data-th]) #app{--card:#1C1C1E}}
.sbrand{display:flex;align-items:center;gap:12px;padding:6px 8px 14px;font-size:20px;font-weight:700;letter-spacing:-.45px}
.sbrand img{width:38px;height:38px;border-radius:10px}
.srow{display:flex;align-items:center;height:52px;padding:0 16px 0 3px;border-radius:1000px;width:100%;text-align:left}
.srow span.i{width:52px;display:flex;justify-content:center;color:var(--accent)}
.srow.on{background:var(--fill)}
.srow.me{margin-top:auto;padding-left:10px;gap:12px}
.clocks{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.clock{background:var(--card);border-radius:22px;padding:12px 16px}
.clock .t{font-size:28px;line-height:34px;font-weight:700;letter-spacing:.38px}
.hero{background:var(--accent);color:#fff;border-radius:26px;padding:20px;margin-top:6px}
.hero h2{font-size:22px}.hero p{margin:4px 0 0;opacity:.85;font-size:15px}
.ev{display:flex;gap:12px;align-items:center;padding:10px 0;position:relative}
.ev .d{width:46px;height:48px;border-radius:12px;background:var(--fill3);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:600;font-size:20px;line-height:22px;flex:none}
.ev .d small{font-size:11px;line-height:13px;text-transform:uppercase;color:var(--red);letter-spacing:.06px}
.ev+.ev:before{left:58px}
.post .ph{width:100%;border-radius:16px;margin-top:10px;background:var(--fill3);min-height:120px;display:block}
/* ---------- feed post card ---------- */
.pc{background:var(--card);border-radius:30px;padding:14px 14px 16px;margin:12px 0;box-shadow:0 1px 2px rgba(0,0,0,.04),0 10px 30px rgba(20,30,60,.07)}
.pc-h{display:flex;align-items:center;gap:12px;padding:2px 2px 12px}
.pc-nm{font-size:17px;line-height:22px;font-weight:600;letter-spacing:-.2px}
.pc-meta{display:flex;align-items:center;gap:5px;font-size:14px;line-height:19px;color:var(--muted);margin-top:2px;min-width:0}
.pc-meta svg{flex:none;opacity:.8}.pc-meta span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pc-meta i{font-style:normal;margin:0 2px;flex:none}
.pc-more{flex:none;width:40px;height:40px;border-radius:50%;background:var(--card);box-shadow:inset 0 0 0 1px var(--sep),0 2px 6px rgba(0,0,0,.05);display:flex;align-items:center;justify-content:center;color:var(--ink)}
.pc-ph{display:block;width:100%;aspect-ratio:1/1;border-radius:22px;overflow:hidden;background:var(--fill3);padding:0;border:0;isolation:isolate}
.pc-ph{position:relative;transition:transform .35s cubic-bezier(.32,.72,0,1);-webkit-tap-highlight-color:transparent}
.pc-ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.pc-ph:active{transform:scale(.985)}
/* photos can't be long-pressed, dragged out or right-clicked to save */
img{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;-webkit-user-drag:none}
.photoview img{pointer-events:none}
.pc-text{background:var(--fill3);border-radius:20px;padding:14px 16px}.pc-text .cap{margin:0}
.pc-acts{display:flex;align-items:center;gap:18px;padding:14px 4px 0}
.pc-acts button{display:inline-flex;align-items:center;gap:7px;font-size:16px;color:var(--ink);background:none;padding:0;min-height:30px}
.pc-acts button.on svg{animation:heartPop .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes heartPop{0%{transform:scale(.6)}100%{transform:scale(1)}}
.pc .cap{margin:10px 4px 0;font-size:16px;line-height:23px;white-space:pre-wrap;overflow-wrap:anywhere}
.cap .full{display:none}.cap.open .full{display:inline}.cap.open .short{display:none}.cap .short b{font-weight:400;color:var(--muted);margin-left:2px}
.cap:not(:has(.short)) .full{display:inline}
.photoview{position:fixed;inset:0;z-index:150;background:rgba(0,0,0,0);display:flex;align-items:center;justify-content:center;transition:background-color .26s}
.photoview.in{background:#000}.photoview.out{background:rgba(0,0,0,0)}
.photoview img{max-width:100%;max-height:100%;object-fit:contain;opacity:0;transform:scale(.92);transition:opacity .26s,transform .35s cubic-bezier(.32,.72,0,1)}
.photoview.in img{opacity:1;transform:none}.photoview.out img{opacity:0;transform:scale(.92)}
.photoview-x{position:absolute;top:calc(env(safe-area-inset-top) + 12px);right:16px;width:40px;height:40px;border-radius:50%;color:#fff;font-size:26px;line-height:1;background:rgba(255,255,255,.16);z-index:1}
.post p{margin:10px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.acts{display:flex;gap:22px;margin-top:12px;font-size:15px;color:var(--muted)}
.acts .on{color:var(--red)}
.habit{display:flex;align-items:center;gap:12px;padding:12px 16px;min-height:68px;border-radius:22px;background:var(--card);margin:8px 0;width:100%;text-align:left}
.habit .e{font-size:28px;width:40px;text-align:center}
.habit .ck{width:28px;height:28px;border-radius:50%;border:2px solid var(--tert);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:15px;flex:none}
.habit.done .ck{background:var(--accent);border-color:var(--accent)}
.habit.done .b{color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0}
.stat{background:var(--card);border-radius:22px;padding:12px 8px;text-align:center}
.stat b{display:block;font-size:22px;line-height:28px;font-weight:700}
.pop{position:fixed;z-index:60;font-weight:700;color:var(--orange);pointer-events:none;animation:pop .9s ease-out forwards}
@keyframes pop{to{transform:translateY(-70px);opacity:0}}
/* tree */
.treebar{display:flex;gap:8px;align-items:center;padding:0 16px 10px}
.treewrap{overflow:auto;background:var(--card);max-height:calc(100vh - 290px);-webkit-overflow-scrolling:touch;border-top:.5px solid var(--sep);border-bottom:.5px solid var(--sep)}
.tree{position:relative;transform-origin:0 0}
.tree svg{position:absolute;left:0;top:0;pointer-events:none}
.tc{position:absolute;width:92px;text-align:center;padding:8px 4px;border-radius:20px;background:var(--page);font-size:13px;font-weight:600;line-height:16px;letter-spacing:-.08px}
.tc.me{box-shadow:0 0 0 2px var(--accent)}
.tc.stub{background:transparent;box-shadow:inset 0 0 0 1px var(--tert)}
.tc>span:not(.av){display:block;margin-top:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tc i{font-style:normal;font-weight:400;color:var(--muted);font-size:11px;display:block}
.tlabel{position:absolute;font-size:15px;font-weight:600;color:var(--muted);white-space:nowrap}
.pad{padding:0 16px}
/* sheet: floating glass card, 8pt inset, 38pt corners */
#sheetWrap{position:fixed;inset:0;background:rgba(0,0,0,.2);z-index:40;display:none;align-items:flex-end;justify-content:center;padding:8px}
#sheetWrap.on{display:flex}
#sheet{background:var(--sheet);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);width:100%;max-width:560px;max-height:calc(100% - 54px - env(safe-area-inset-top));overflow:auto;border-radius:var(--rb,38px);padding:0 16px calc(22px + env(safe-area-inset-bottom) * .4);box-shadow:0 0 0 .5px var(--rim),0 8px 48px rgba(0,0,0,.25)}
#sheet:before{content:"";display:block;width:58px;height:4px;border-radius:100px;background:var(--grab);margin:6px auto 5px}
@media(min-width:700px){#sheetWrap{align-items:center}}
.sh{display:flex;align-items:center;justify-content:flex-end;min-height:44px;margin-bottom:10px;position:relative}
.sh h2{position:absolute;left:52px;right:52px;text-align:center;font-size:17px;line-height:22px;font-weight:600;letter-spacing:-.43px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.x{width:44px;height:44px;border-radius:50%;font-size:22px;font-weight:500;line-height:1;background:var(--glass);box-shadow:0 0 0 .5px var(--rim),0 4px 12px rgba(0,0,0,.06);flex:none}
.card .x,.row .x{width:30px;height:30px;font-size:17px;box-shadow:none;background:var(--fill3);color:var(--muted)}
label{display:block;font-size:13px;line-height:18px;color:var(--muted);letter-spacing:-.08px;margin:14px 16px 6px}
input[type=text],input[type=date],input[type=time],input[type=number],input[type=password],select,textarea{width:100%;border:0;background:var(--card);border-radius:16px;padding:15px 16px;min-height:52px;outline:none;-webkit-appearance:none;appearance:none}
input:focus,select:focus,textarea:focus{box-shadow:0 0 0 2px var(--accent)}
input[type=file]{font-size:15px;width:100%}
textarea{min-height:96px;resize:vertical;display:block}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}.two>div{min-width:0}input{min-width:0;max-width:100%}
.days{display:flex;gap:6px}.days label{margin:0;flex:1}
.days input{display:none}.days span{display:block;text-align:center;padding:9px 0;border-radius:1000px;background:var(--card);font-size:15px;color:var(--ink);font-weight:600}
.days input:checked+span{background:var(--accent);color:var(--onacc)}
.check{display:flex;align-items:center;gap:10px;font-size:17px;line-height:22px;color:var(--ink);letter-spacing:-.43px;margin:10px 0;background:var(--card);border-radius:16px;padding:13px 16px}
.check input{width:22px;height:22px;accent-color:var(--accent);flex:none}
form .btn.block{margin-top:16px}
#toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);background:rgba(40,40,40,.86);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);color:#fff;padding:11px 18px;border-radius:1000px;font-weight:600;font-size:15px;z-index:80;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{opacity:1}
.banner{background:var(--fill);color:var(--muted);font-size:13px;line-height:18px;text-align:center;padding:6px 12px;padding-top:calc(6px + env(safe-area-inset-top))}
.login{max-width:420px;margin:0 auto;padding:12vh 22px 40px;text-align:center}
.login img{width:92px;height:92px;border-radius:22px}
.login h1{margin:16px 0 6px}
.login label{text-align:left}
.who{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0;text-align:center}
.who button{background:var(--card);border-radius:22px;padding:12px 4px;font-weight:600;font-size:13px}
.fact{display:flex;gap:10px;padding:11px 0;position:relative}.fact+.fact:before{content:"";position:absolute;left:0;right:0;top:0;height:.5px;background:var(--sep)}
.fact b{width:128px;flex:none;color:var(--muted);font-weight:400}
.empty{text-align:center;color:var(--muted);padding:26px 10px;font-size:15px;line-height:20px}
.opt{display:block;width:100%;text-align:left;padding:15px 16px;border-radius:16px;background:var(--fill3);margin:8px 0}
.opt.right{background:color-mix(in srgb,var(--green) 22%,transparent);font-weight:600}.opt.wrong{background:color-mix(in srgb,var(--red) 18%,transparent)}

/* colour (iOS system palette) */
.hero{background:linear-gradient(135deg,#0088FF,#6155F5 55%,#CB30E0)}
:root[data-th] .hero{color:var(--onacc);background:linear-gradient(135deg,var(--accent),color-mix(in oklch,var(--accent) 45%,var(--hero2,#CB30E0)))}
.clock:nth-child(4n+1) .t{color:#0088FF}.clock:nth-child(4n+2) .t{color:#FF8D28}.clock:nth-child(4n+3) .t{color:#34C759}.clock:nth-child(4n+4) .t{color:#CB30E0}
.chip.sel[style]{background:var(--c)}
.khero{display:flex;align-items:center;gap:16px;border-radius:26px;padding:16px 18px;margin:10px 0;color:#fff;background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 55%,#6155F5))}
.khero p{margin:2px 0 0;opacity:.9;font-size:15px;line-height:20px}
.ring{width:76px;height:76px;flex:none}
.ring circle{fill:none;stroke-width:9;stroke-linecap:round}.ring .trk{stroke:rgba(255,255,255,.3)}.ring .prg{stroke:#fff}
.ring text{fill:#fff;font-size:17px;font-weight:700;letter-spacing:0}
.stat{background:color-mix(in srgb,var(--c,var(--accent)) 14%,var(--card))}.stat b{color:var(--c,var(--ink))}
.tile{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px;flex:none;background:color-mix(in srgb,var(--c,var(--accent)) 20%,transparent)}
.habit.done .ck{background:var(--c,var(--accent));border-color:var(--c,var(--accent))}
.habit.done{background:color-mix(in srgb,var(--c,var(--accent)) 10%,var(--card))}
.rank{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff;background:var(--tert);flex:none}
.rank.r1{background:#FFCC00;color:#5c4700}.rank.r2{background:#A2A2A7}.rank.r3{background:#AC7F5E}
.meet{background:linear-gradient(160deg,color-mix(in srgb,var(--c) 26%,var(--card)),var(--card) 62%)}

  if (db === 0) return gr(da - 1) + pick('mother', 'father', 'parent');
  if (da === 0) return gr(db - 1) + pick('daughter', 'son', 'child');
  if (da === 1 && db === 1) return pick('sister', 'brother', 'sibling');
  if (db === 1) return (da > 2 ? gr(da - 2).replace('grand', 'great-') : '') + pick('aunt', 'uncle', 'aunt/uncle');
  if (da === 1) return (db > 2 ? gr(db - 2).replace('grand', 'great-') : '') + pick('niece', 'nephew', 'niece/nephew');

/* ---------- TREE ---------- */
const CW = 92, CH = 112, SG = 8, GAP = 22, LV = 168, TG = 70, PADX = 30, PADY = 54;
function treeModel(){
  const ms = [...st.db.members].sort(byBirth), hasPar = m => parentsOf(m).length > 0;
  const kidsOfUnit = (a, b) => ms.filter(c => [c.fatherId, c.motherId].some(x => x && (x === a.id || (b && x === b.id))));
  const roots = [], used = new Set(), loose = [];
  for (const m of ms){
    if (hasPar(m) || used.has(m.id)) continue;
    const sp = spouseOf(m); if (sp && hasPar(sp)) continue;
    used.add(m.id); if (sp) used.add(sp.id);
    if (!sp && !kidsOfUnit(m).length){ loose.push(m); continue; }
    roots.push(m);
  }
  const mine = new Set(); (function up(m, n){ if (!m || n > 12) return; const ps = parentsOf(m); if (!ps.length) mine.add(m.id); ps.forEach(p => up(p, n + 1)); })(me(), 0);
  roots.sort((a, b) => { const s = r => (mine.has(r.id) || (spouseOf(r) && mine.has(spouseOf(r).id))) ? 0 : 1; return s(a) - s(b); });
  const placed = new Map(), trees = [];
  function build(p, depth, path){
    const u = { p, depth, kids: [] };
    if (placed.has(p.id)){ u.stub = true; u.w = CW; return u; }
    placed.set(p.id, u);
    const sp = spouseOf(p); if (sp && !placed.has(sp.id)){ u.sp = sp; placed.set(sp.id, u); }
    const np = new Set(path).add(p.id); if (u.sp) np.add(u.sp.id);
    u.kids = kidsOfUnit(p, u.sp).filter(k => !np.has(k.id)).map(k => build(k, depth + 1, np));
    const self = u.sp ? CW * 2 + SG : CW, kw = u.kids.reduce((s, k) => s + k.w, 0) + GAP * Math.max(0, u.kids.length - 1);
    u.w = Math.max(self, kw); u.kw = kw; return u;
  }
  let x = PADX; const nodes = [], lines = [], links = [], labels = [], pos = {};
  for (const r of roots){
    const t = build(r, 0, new Set());
    let off = 0; (function f(u){ if (u.stub && off === 0 && placed.get(u.p.id).abs != null){ off = placed.get(u.p.id).abs - u.depth; } u.kids.forEach(f); })(t);
    (function place(u, x0){
      u.abs = u.depth + off; u.cx = x0 + u.w / 2;
      let kx = x0 + (u.w - (u.kw || 0)) / 2;
      for (const k of u.kids){ place(k, kx); kx += k.w + GAP; }
    })(t, x);
    trees.push(t); x += t.w + TG;
  }
  let minD = 0, maxD = 0; (function walk(us){ for (const u of us){ minD = Math.min(minD, u.abs); maxD = Math.max(maxD, u.abs); walk(u.kids); } })(trees);
  const Y = u => PADY + (u.abs - minD) * LV;
  (function emit(us){ for (const u of us){
    const y = Y(u), half = (CW + SG) / 2;
    if (u.stub){ nodes.push({ m:u.p, x:u.cx - CW/2, y, stub:true }); links.push({ id:u.p.id, x:u.cx, y:y + CH/2 }); }
    else if (u.sp){ nodes.push({ m:u.p, x:u.cx - half - CW/2, y }); nodes.push({ m:u.sp, x:u.cx + half - CW/2, y }); pos[u.p.id] = { x:u.cx - half, y:y + CH/2 }; pos[u.sp.id] = { x:u.cx + half, y:y + CH/2 }; lines.push(`M${u.cx - SG/2 - 2} ${y + 40}H${u.cx + SG/2 + 2}`); }
    else { nodes.push({ m:u.p, x:u.cx - CW/2, y }); pos[u.p.id] = { x:u.cx, y:y + CH/2 }; }
    if (u.kids.length){ const my = y + CH + (LV - CH) / 2; for (const k of u.kids){ const kx = (k.sp && !k.stub) ? k.cx - half : k.cx; lines.push(`M${u.cx} ${y + (u.sp ? 40 : CH)}V${my}H${kx}V${Y(k)}`); } }
    emit(u.kids);
  } })(trees);
  for (const t of trees) labels.push({ x: t.cx - (t.sp ? CW + SG/2 : CW/2), y: Y(t) - 30, text: first(t.p) + (t.sp ? ' & ' + first(t.sp) : '') + "'s family" });
  return { nodes, lines, links: links.filter(l => pos[l.id]).map(l => ({ a:l, b:pos[l.id] })), labels, loose, W: Math.max(x - TG + PADX, 320), H: PADY + (maxD - minD) * LV + CH + 40 };
}

/* full photos: the whole pictures (not cropped) over a dark background; swipe sideways between them, tap or drag down to close */
function openPhoto(ids, start){
  if ($('.photoview')) return; Motion.haptic();
  const list = String(ids).split(',').filter(Boolean), many = list.length > 1;
  const el = document.createElement('div'); el.className = 'photoview';
  el.innerHTML = `<button class="photoview-x glass" aria-label="Close">×</button>${many ? `<span class="pv-count">${(start || 0) + 1} of ${list.length}</span>` : ''}<div class="pv-track">${list.map(() => `<div class="pv-slide"><img alt="" draggable="false"></div>`).join('')}</div>${many ? `<div class="dots light">${list.map((_, i) => `<i class="${i === (start || 0) ? 'on' : ''}"></i>`).join('')}</div>` : ''}`;
  document.body.appendChild(el); lockPage(true);
  const track = el.querySelector('.pv-track'), imgs = [...el.querySelectorAll('.pv-slide img')];
  list.forEach((id, i) => getPhoto(id).then(d => { if (d) imgs[i].src = d; }).catch(() => {}));
  track.scrollLeft = (start || 0) * track.clientWidth;
  let cur = start || 0;
  track.addEventListener('scroll', () => { const i = Math.round(track.scrollLeft / Math.max(1, track.clientWidth)); if (i === cur) return; cur = i; Motion.haptic();
    el.querySelectorAll('.dots i').forEach((d, k) => d.classList.toggle('on', k === i)); const c = el.querySelector('.pv-count'); if (c) c.textContent = (i + 1) + ' of ' + list.length; }, { passive:true });
  requestAnimationFrame(() => el.classList.add('in'));
  const close = () => { el.classList.remove('in'); el.classList.add('out'); setTimeout(() => { el.remove(); if (!sheetFn) lockPage(false); }, 260); };
  let x0 = 0, y0 = null, dy = 0, mode = '';
  el.addEventListener('touchstart', e => { if (e.touches.length === 1){ x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; dy = 0; mode = ''; } }, { passive:true });
  el.addEventListener('touchmove', e => { if (y0 == null) return; const ddx = e.touches[0].clientX - x0, ddy = e.touches[0].clientY - y0;
    if (!mode){ if (Math.abs(ddx) < 6 && Math.abs(ddy) < 6) return; mode = Math.abs(ddy) > Math.abs(ddx) ? 'v' : 'h'; }
    if (mode !== 'v') return; e.preventDefault(); dy = ddy; const im = imgs[cur]; im.style.transition = 'none'; im.style.transform = `translateY(${dy}px) scale(${1 - Math.min(.25, Math.abs(dy) / 1200)})`; el.style.backgroundColor = `rgba(0,0,0,${Math.max(.3, 1 - Math.abs(dy) / 500)})`; }, { passive:false });
  el.addEventListener('touchend', () => { if (y0 == null) return; y0 = null; if (mode !== 'v') return; const im = imgs[cur]; im.style.transition = ''; el.dataset.moved = '1';
    if (Math.abs(dy) > 110) close(); else { im.style.transform = ''; el.style.backgroundColor = ''; } });
  el.addEventListener('click', e => { if (el.dataset.moved){ delete el.dataset.moved; return; } if (mode === 'h') return; close(); });
}

/* ---------- RELATIVES: pick someone already in the family and say how they are related ---------- */
function linkPlan(ms, aId, rel, bId) {
  const A = ms.filter(function (m) { return m.id === aId; })[0], B = ms.filter(function (m) { return m.id === bId; })[0];
  if (!A || !B || aId === bId) throw new Error('Choose a person');
  const slot = function (p) { return p.gender === 'female' ? 'motherId' : 'fatherId'; };
  if (rel === 'father' || rel === 'mother') {
    if (B.fatherId === aId || B.motherId === aId) throw new Error('That would make them each other\'s parent');
    return [{ id: aId, field: rel + 'Id', value: bId }];
  }
  if (rel === 'spouse') return [{ id: aId, field: 'spouseId', value: bId }];
  if (rel === 'child') {
    if (A.fatherId === bId || A.motherId === bId) throw new Error('That would make them each other\'s parent');
    if (!A.gender) throw new Error('Set male or female in the profile first, so the tree knows father or mother');
    const out = [{ id: bId, field: slot(A), value: aId }];
    const sp = ms.filter(function (m) { return m.id === A.spouseId || m.spouseId === aId; })[0];
    if (sp && sp.gender && slot(sp) !== slot(A) && !B[slot(sp)]) out.push({ id: bId, field: slot(sp), value: sp.id });
    return out;
  }
  if (rel === 'sibling') {
    const out = [];
    ['fatherId', 'motherId'].forEach(function (f) { if (A[f] && !B[f]) out.push({ id: bId, field: f, value: A[f] }); else if (B[f] && !A[f]) out.push({ id: aId, field: f, value: B[f] }); });
    if (out.length) return out;
    if ((A.fatherId && A.fatherId === B.fatherId) || (A.motherId && A.motherId === B.motherId)) throw new Error('They are already linked as brother or sister');
    if (!A.fatherId && !A.motherId && !B.fatherId && !B.motherId) throw new Error('Add a father or mother to one of them first. Brothers and sisters are linked through a shared parent.');
    throw new Error('They have different parents in the tree. Check the parents first.');
  }
  throw new Error('Unknown relationship');
}
const siblingsOf = m => st.db.members.filter(x => x.id !== m.id && ((m.fatherId && x.fatherId === m.fatherId) || (m.motherId && x.motherId === m.motherId))).sort(byBirth);

  const R = st.rel, A = M(R.a), B = M(R.b), mine = R.a === st.db.me, whose = mine ? 'my' : first(A) + "'s";
  if (!B){
    const list = st.db.members.filter(x => x.id !== R.a).sort((a, b) => String(a.name).localeCompare(b.name));
    return `<div class="sh"><h2>Add a relative</h2><button class="x" onclick="closeSheet()">×</button></div><input type="text" placeholder="Search the family" oninput="relFilter(this.value)" autocomplete="off"><div class="card" id="relList" style="max-height:44vh;overflow:auto">${list.length ? list.map(x => `<div class="row lrow" data-n="${esc(String(x.name + ' ' + (x.nick || '')).toLowerCase())}" style="padding:8px 0" onclick="st.rel.b='${x.id}';$('#sheet').innerHTML=relHtml();Motion.arm($('#sheet'))">${av(x, 40)}<div class="grow"><div class="b">${esc(x.name)}</div><div class="small muted">${esc(cap(relation(x.id)))}${x.country ? ' · ' + flag(x.country) + ' ' + esc(cname(x.country)) : ''}</div></div></div>`).join('') : '<div class="empty">Nobody else has joined yet.</div>'}</div><div class="sec"><h3>Someone not in the app yet</h3></div><div class="chips">${isKid(A) ? '' : `<button class="chip" onclick="memberForm(null,{childOf:'${A.id}'})">+ New child</button>`}${parentsOf(A).length < 2 ? `<button class="chip" onclick="memberForm(null,{parentFor:'${A.id}'})">+ New parent</button>` : ''}${!spouseOf(A) && !isKid(A) ? `<button class="chip" onclick="memberForm(null,{spouseOf:'${A.id}'})">+ New husband / wife</button>` : ''}</div>`;
  }
  const g = B.gender, opts = [['father', 'Father'], ['mother', 'Mother'], ['sibling', g === 'female' ? 'Sister' : g === 'male' ? 'Brother' : 'Brother / sister'], ['spouse', g === 'female' ? 'Wife' : g === 'male' ? 'Husband' : 'Husband / wife'], ['child', g === 'female' ? 'Daughter' : g === 'male' ? 'Son' : 'Son / daughter']]

  return `<div class="sh"><h2>How are they related?</h2><button class="x" onclick="closeSheet()">×</button></div><div style="text-align:center">${av(B, 72)}<h2 style="margin-top:8px">${esc(B.name)}</h2><p class="muted" style="margin:4px 0 12px">${esc(first(B))} is ${esc(whose)}…</p></div>${opts.map(o => `<button class="opt" onclick="linkRel('${o[0]}',event)"><b>${o[1]}</b></button>`).join('')}<p class="small muted" style="margin:12px 16px 0">Grandparents, uncles, aunts, cousins, nieces and nephews are worked out automatically once parents are linked.</p>`;

const navMini = on => { const n = $('#nav'); if (n) n.classList.toggle('mini', on); };
SC().addEventListener('scroll', () => {
  document.body.classList.toggle('scrolled', pageY() > 16);
  if (navRaf) return; navRaf = requestAnimationFrame(() => { navRaf = 0;
    const sc = SC(), y = Math.max(0, Math.min(sc.scrollTop, sc.scrollHeight - sc.clientHeight)), d = y - navY;
    if (y <= 24 || d < -6) { navMini(false); navY = y; } else if (d > 8 && y > 60) { navMini(true); navY = y; } else if (Math.abs(d) > 40) navY = y; });
}, { passive:true });
document.addEventListener('touchstart', e => { if (e.target.closest && e.target.closest('#nav')) navMini(false); }, { passive:true });
document.addEventListener('pointerdown', e => { if (e.target.closest && e.target.closest('#nav')) navMini(false); }, { passive:true });
document.addEventListener('visibilitychange', () => { if (!document.hidden && st.db && !DEMO && !sheetFn && !(st.tab === 'chat' && st.chatWith)) sync().catch(() => {}); if (!document.hidden) wakePoll(); });
setInterval(() => { if (st.db && st.tab === 'home' && !sheetFn && !document.hidden) render(); }, 60000);
</script>
</body>

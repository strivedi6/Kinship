<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Kinship</title>
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Kinship">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
:root{--accent:#0088FF;--page:#F2F2F7;--card:#FFFFFF;--side:#F2F2F7;--ink:#000;--muted:rgba(60,60,67,.6);--tert:rgba(60,60,67,.3);--fill:rgba(120,120,128,.16);--fill3:rgba(118,118,128,.12);--sep:rgba(60,60,67,.14);--glass:rgba(255,255,255,.74);--rim:#E8E8E8;--sel:#EDEDED;--sheet:rgba(242,242,247,.96);--orange:#C55300;--orange2:rgba(255,141,40,.16);--red:#FF383C;--green:#34C759;--grab:#CCC;color-scheme:light dark}
@media(prefers-color-scheme:dark){:root{--accent:#0091FF;--page:#000;--card:#1C1C1E;--side:#1C1C1E;--ink:#FFF;--muted:rgba(235,235,245,.6);--tert:rgba(235,235,245,.3);--fill:rgba(120,120,128,.32);--fill3:rgba(118,118,128,.24);--sep:rgba(84,84,88,.6);--glass:rgba(44,44,46,.74);--rim:rgba(255,255,255,.14);--sel:rgba(255,255,255,.14);--sheet:rgba(28,28,30,.96);--orange:#FF9F45;--red:#FF4245;--grab:#5A5A5E}#sheet{--card:#2C2C2E}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--page);color:var(--ink);font:400 17px/22px -apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro","Helvetica Neue",system-ui,sans-serif;letter-spacing:-.43px;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
h1,h2,h3{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro","Helvetica Neue",system-ui,sans-serif}
h1{font-size:34px;line-height:41px;font-weight:700;letter-spacing:.4px}
h2{font-size:22px;line-height:28px;font-weight:700;letter-spacing:-.26px}
h3{font-size:17px;line-height:22px;font-weight:600;letter-spacing:-.43px}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
img{max-width:100%}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);box-shadow:0 0 0 .5px var(--rim),0 8px 24px rgba(0,0,0,.10)}
#app{max-width:760px;margin:0 auto;min-height:100%;padding:0 16px calc(110px + env(safe-area-inset-bottom))}
#app.wide{max-width:none;padding-left:0;padding-right:0}
.top{padding:calc(6px + env(safe-area-inset-top)) 0 10px}
#app.wide .top{padding-left:16px;padding-right:16px}
.top .bar{display:flex;justify-content:flex-end;align-items:center;min-height:44px;margin-bottom:8px}
.top .bar button{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.top .sub{font-size:15px;line-height:20px;color:var(--muted);letter-spacing:-.23px;margin-top:2px}
.card{background:var(--card);border-radius:26px;padding:16px;margin:12px 0}
button.card{display:flex}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}.small{font-size:13px;line-height:18px;letter-spacing:-.08px}.b{font-weight:600}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:28px 4px 6px}
.sec a,.link{color:var(--accent);font-weight:400;font-size:17px;text-decoration:none;cursor:pointer}
.small .link{font-size:13px}
.lrow{position:relative}.lrow+.lrow:before,.ev+.ev:before{content:"";position:absolute;left:48px;right:0;top:0;height:.5px;background:var(--sep)}
.lrow:after{content:"›";color:var(--tert);font-weight:600;font-size:20px;margin-left:4px}
.btn{background:var(--accent);color:#fff;border-radius:1000px;min-height:50px;padding:0 20px;font-weight:600;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn.ghost{background:color-mix(in srgb,var(--accent) 15%,transparent);color:var(--accent)}
.btn.clay{background:var(--accent)}
.btn.line{background:var(--fill);color:var(--ink)}
.btn.sm{min-height:34px;padding:0 14px;font-size:15px;letter-spacing:-.23px}
.btn.block{display:flex;width:100%}
.btn:disabled{background:var(--fill);color:var(--tert)}
.btn:active,.chip:active,.habit:active,.opt:active{opacity:.6}
.av{border-radius:50%;object-fit:cover;flex:none;display:inline-flex;align-items:center;justify-content:center;font-weight:600;color:#fff;background:linear-gradient(#A9BCE1,#7983BE);overflow:hidden;letter-spacing:0}
.av.passed{filter:grayscale(1);opacity:.75}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--fill);color:var(--ink);border-radius:1000px;padding:6px 12px;font-weight:600;font-size:13px;line-height:18px;letter-spacing:-.08px;white-space:nowrap}
.chip.clay{background:var(--orange2);color:var(--orange)}
.chip.sel{background:var(--accent);color:#fff}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.seg{display:flex;background:var(--fill3);border-radius:1000px;padding:2px;margin:6px 0 8px;height:36px}
.seg button{flex:1;border-radius:1000px;font-weight:500;font-size:14px;letter-spacing:-.15px}
.seg button.on{background:var(--card);font-weight:600;box-shadow:0 2px 6px rgba(0,0,0,.10),0 0 0 .5px var(--sep)}
@media(prefers-color-scheme:dark){.seg button.on{background:#636366}}
/* tab bar: floating glass capsule */
.nav{position:fixed;left:0;right:0;bottom:0;padding:16px 21px calc(25px + env(safe-area-inset-bottom) * .4);z-index:20;pointer-events:none}
.nav div{max-width:360px;margin:0 auto;display:flex;padding:4px;border-radius:1000px;pointer-events:auto}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:6px 4px 7px;font-size:10px;line-height:12px;font-weight:600;letter-spacing:0;color:var(--ink);border-radius:100px}
.nav button.on{color:var(--accent);background:var(--sel)}
.nav svg,.srow svg{width:26px;height:28px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
/* sidebar (Mac / wide) */
#side{display:none}
@media(min-width:900px){
  :root{--page:#FFFFFF}
  #side{display:flex;flex-direction:column;gap:8px;position:fixed;left:0;top:0;bottom:0;width:300px;background:var(--side);padding:24px 20px;z-index:20;overflow:auto;border-right:.5px solid var(--sep)}
  #side[hidden]{display:none}
  #app{--card:#F2F2F7}
  #app.shell{margin-left:300px;max-width:none;padding:8px 40px 60px}
  #app.shell>*{max-width:820px;margin-left:auto;margin-right:auto}
  #app.shell.wide{padding-left:0;padding-right:0}
  #app.shell.wide>*{max-width:none}
  #app.shell.wide .top,#app.shell.wide .treebar,#app.shell.wide .pad{padding-left:40px;padding-right:40px}
  .nav{display:none}
  .top .bar{display:none}.top{padding-top:28px}
  #sheetWrap.shell{left:300px}
}
@media(min-width:900px) and (prefers-color-scheme:dark){:root{--page:#000}#app{--card:#1C1C1E}}
.sbrand{display:flex;align-items:center;gap:12px;padding:6px 8px 14px;font-size:20px;font-weight:700;letter-spacing:-.45px}
.sbrand img{width:38px;height:38px;border-radius:10px}
.srow{display:flex;align-items:center;height:52px;padding:0 16px 0 3px;border-radius:1000px;width:100%;text-align:left}
.srow span.i{width:52px;display:flex;justify-content:center;color:var(--accent)}
.srow.on{background:var(--fill)}
.srow.me{margin-top:auto;padding-left:10px;gap:12px}
.clocks{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.clock{background:var(--card);border-radius:22px;padding:12px 16px}
.clock .t{font-size:28px;line-height:34px;font-weight:700;letter-spacing:.38px}
.hero{background:var(--accent);color:#fff;border-radius:26px;padding:20px;margin-top:6px}
.hero h2{font-size:22px}.hero p{margin:4px 0 0;opacity:.85;font-size:15px}
.ev{display:flex;gap:12px;align-items:center;padding:10px 0;position:relative}
.ev .d{width:46px;height:48px;border-radius:12px;background:var(--fill3);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:600;font-size:20px;line-height:22px;flex:none}
.ev .d small{font-size:11px;line-height:13px;text-transform:uppercase;color:var(--red);letter-spacing:.06px}
.ev+.ev:before{left:58px}
.post .ph{width:100%;border-radius:16px;margin-top:10px;background:var(--fill3);min-height:120px;display:block}
.post p{margin:10px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.acts{display:flex;gap:22px;margin-top:12px;font-size:15px;color:var(--muted)}
.acts .on{color:var(--red)}
.habit{display:flex;align-items:center;gap:12px;padding:12px 16px;min-height:68px;border-radius:22px;background:var(--card);margin:8px 0;width:100%;text-align:left}
.habit .e{font-size:28px;width:40px;text-align:center}
.habit .ck{width:28px;height:28px;border-radius:50%;border:2px solid var(--tert);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:15px;flex:none}
.habit.done .ck{background:var(--accent);border-color:var(--accent)}
.habit.done .b{color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0}
.stat{background:var(--card);border-radius:22px;padding:12px 8px;text-align:center}
.stat b{display:block;font-size:22px;line-height:28px;font-weight:700}
.pop{position:fixed;z-index:60;font-weight:700;color:var(--orange);pointer-events:none;animation:pop .9s ease-out forwards}
@keyframes pop{to{transform:translateY(-70px);opacity:0}}
/* tree */
.treebar{display:flex;gap:8px;align-items:center;padding:0 16px 10px}
.treewrap{overflow:auto;background:var(--card);max-height:calc(100vh - 290px);-webkit-overflow-scrolling:touch;border-top:.5px solid var(--sep);border-bottom:.5px solid var(--sep)}
.tree{position:relative;transform-origin:0 0}
.tree svg{position:absolute;left:0;top:0;pointer-events:none}
.tc{position:absolute;width:92px;text-align:center;padding:8px 4px;border-radius:20px;background:var(--page);font-size:13px;font-weight:600;line-height:16px;letter-spacing:-.08px}
.tc.me{box-shadow:0 0 0 2px var(--accent)}
.tc.stub{background:transparent;box-shadow:inset 0 0 0 1px var(--tert)}
.tc>span:not(.av){display:block;margin-top:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tc i{font-style:normal;font-weight:400;color:var(--muted);font-size:11px;display:block}
.tlabel{position:absolute;font-size:15px;font-weight:600;color:var(--muted);white-space:nowrap}
.pad{padding:0 16px}
/* sheet: floating glass card, 8pt inset, 38pt corners */
#sheetWrap{position:fixed;inset:0;background:rgba(0,0,0,.2);z-index:40;display:none;align-items:flex-end;justify-content:center;padding:8px 8px calc(8px + env(safe-area-inset-bottom) * .5)}
#sheetWrap.on{display:flex}
#sheet{background:var(--sheet);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);width:100%;max-width:560px;max-height:calc(100% - 54px - env(safe-area-inset-top));overflow:auto;border-radius:38px;padding:0 16px 22px;box-shadow:0 0 0 .5px var(--rim),0 8px 48px rgba(0,0,0,.25)}
#sheet:before{content:"";display:block;width:58px;height:4px;border-radius:100px;background:var(--grab);margin:6px auto 5px}
@media(min-width:700px){#sheetWrap{align-items:center}}
.sh{display:flex;align-items:center;justify-content:flex-end;min-height:44px;margin-bottom:10px;position:relative}
.sh h2{position:absolute;left:52px;right:52px;text-align:center;font-size:17px;line-height:22px;font-weight:600;letter-spacing:-.43px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.x{width:44px;height:44px;border-radius:50%;font-size:22px;font-weight:500;line-height:1;background:var(--glass);box-shadow:0 0 0 .5px var(--rim),0 4px 12px rgba(0,0,0,.06);flex:none}
.card .x,.row .x{width:30px;height:30px;font-size:17px;box-shadow:none;background:var(--fill3);color:var(--muted)}
label{display:block;font-size:13px;line-height:18px;color:var(--muted);letter-spacing:-.08px;margin:14px 16px 6px}
input[type=text],input[type=date],input[type=time],input[type=number],input[type=password],select,textarea{width:100%;border:0;background:var(--card);border-radius:16px;padding:15px 16px;min-height:52px;outline:none;-webkit-appearance:none;appearance:none}
input:focus,select:focus,textarea:focus{box-shadow:0 0 0 2px var(--accent)}
input[type=file]{font-size:15px;width:100%}
textarea{min-height:96px;resize:vertical;display:block}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}.two>div{min-width:0}input{min-width:0;max-width:100%}
.days{display:flex;gap:6px}.days label{margin:0;flex:1}
.days input{display:none}.days span{display:block;text-align:center;padding:9px 0;border-radius:1000px;background:var(--card);font-size:15px;color:var(--ink);font-weight:600}
.days input:checked+span{background:var(--accent);color:#fff}
.check{display:flex;align-items:center;gap:10px;font-size:17px;line-height:22px;color:var(--ink);letter-spacing:-.43px;margin:10px 0;background:var(--card);border-radius:16px;padding:13px 16px}
.check input{width:22px;height:22px;accent-color:var(--accent);flex:none}
form .btn.block{margin-top:16px}
#toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);background:rgba(40,40,40,.86);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);color:#fff;padding:11px 18px;border-radius:1000px;font-weight:600;font-size:15px;z-index:80;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{opacity:1}
.banner{background:var(--fill);color:var(--muted);font-size:13px;line-height:18px;text-align:center;padding:6px 12px;padding-top:calc(6px + env(safe-area-inset-top))}
.login{max-width:420px;margin:0 auto;padding:12vh 22px 40px;text-align:center}
.login img{width:92px;height:92px;border-radius:22px}
.login h1{margin:16px 0 6px}
.login label{text-align:left}
.who{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0;text-align:center}
.who button{background:var(--card);border-radius:22px;padding:12px 4px;font-weight:600;font-size:13px}
.fact{display:flex;gap:10px;padding:11px 0;position:relative}.fact+.fact:before{content:"";position:absolute;left:0;right:0;top:0;height:.5px;background:var(--sep)}
.fact b{width:128px;flex:none;color:var(--muted);font-weight:400}
.empty{text-align:center;color:var(--muted);padding:26px 10px;font-size:15px;line-height:20px}
.opt{display:block;width:100%;text-align:left;padding:15px 16px;border-radius:16px;background:var(--fill3);margin:8px 0}
.opt.right{background:color-mix(in srgb,var(--green) 22%,transparent);font-weight:600}.opt.wrong{background:color-mix(in srgb,var(--red) 18%,transparent)}

/* colour (iOS system palette) */
.hero{background:linear-gradient(135deg,#0088FF,#6155F5 55%,#CB30E0)}
.clock:nth-child(4n+1) .t{color:#0088FF}.clock:nth-child(4n+2) .t{color:#FF8D28}.clock:nth-child(4n+3) .t{color:#34C759}.clock:nth-child(4n+4) .t{color:#CB30E0}
.chip.sel[style]{background:var(--c)}
.khero{display:flex;align-items:center;gap:16px;border-radius:26px;padding:16px 18px;margin:10px 0;color:#fff;background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 55%,#6155F5))}
.khero p{margin:2px 0 0;opacity:.9;font-size:15px;line-height:20px}
.ring{width:76px;height:76px;flex:none}
.ring circle{fill:none;stroke-width:9;stroke-linecap:round}.ring .trk{stroke:rgba(255,255,255,.3)}.ring .prg{stroke:#fff}
.ring text{fill:#fff;font-size:17px;font-weight:700;letter-spacing:0}
.stat{background:color-mix(in srgb,var(--c,var(--accent)) 14%,var(--card))}.stat b{color:var(--c,var(--ink))}
.tile{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px;flex:none;background:color-mix(in srgb,var(--c,var(--accent)) 20%,transparent)}
.habit.done .ck{background:var(--c,var(--accent));border-color:var(--c,var(--accent))}
.habit.done{background:color-mix(in srgb,var(--c,var(--accent)) 10%,var(--card))}
.rank{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff;background:var(--tert);flex:none}
.rank.r1{background:#FFCC00;color:#5c4700}.rank.r2{background:#A2A2A7}.rank.r3{background:#AC7F5E}
.meet{background:linear-gradient(160deg,color-mix(in srgb,var(--c) 26%,var(--card)),var(--card) 62%)}
.qcard{background:linear-gradient(135deg,#FFE27A,#FFB45C);color:#1C1C1E}.qcard input[type=text]{background:#fff;color:#000}
.quiz{background:color-mix(in srgb,#6155F5 12%,var(--card))}
/* motion (same easings as Orbit) */
:root{--ease:cubic-bezier(.32,.72,0,1);--spring:cubic-bezier(.34,1.36,.64,1)}
.btn,.chip,.habit,.opt,.x,.nav button,.srow,.seg button,.tc,.who button{transition:transform .25s var(--ease),background-color .25s var(--ease),opacity .2s}
.btn:active,.chip:active,.opt:active,.x:active,.who button:active{transform:scale(.96);opacity:1}
.habit:active{transform:scale(.985);opacity:1}.nav button:active,.srow:active{transform:scale(.94)}
#sheetWrap.on{animation:fadeIn .25s ease}
#sheetWrap.on #sheet{animation:sheetUp .5s var(--ease)}
@keyframes fadeIn{from{opacity:0}}
@keyframes sheetUp{from{transform:translateY(60px) scale(.985);opacity:0}}
#toast{transition:opacity .25s,transform .45s var(--spring);transform:translateX(-50%) translateY(16px)}#toast.on{transform:translateX(-50%)}
.cf{position:fixed;top:-12px;width:9px;height:14px;border-radius:2px;z-index:90;pointer-events:none}
[data-haptic]{position:absolute;inset:0;z-index:5;border-radius:inherit;touch-action:manipulation;cursor:pointer;margin:0;padding:0;background:none}
[data-haptic] input{position:absolute;width:1px;height:1px;margin:0;padding:0;opacity:0;visibility:hidden;pointer-events:none;min-height:0}
#syncbar{position:fixed;left:0;right:0;top:0;height:2.5px;z-index:95;pointer-events:none;opacity:0;transition:opacity .3s;background:linear-gradient(90deg,transparent,var(--accent),#CB30E0,transparent) 0 0/50% 100% no-repeat}
#syncbar.on{opacity:1;animation:syncrun 1.1s linear infinite}
@keyframes syncrun{from{background-position:-60% 0}to{background-position:160% 0}}
.splash{height:80vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;color:var(--muted);font-size:15px}
.splash img{width:96px;height:96px;border-radius:22px;animation:breathe 1.6s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.06)}}
/* busy buttons: locked while saving, with a filling wave and a spinning ring (as in Orbit) */
.btn.is-busy{position:relative;overflow:visible;pointer-events:none;opacity:1!important;background:var(--accent)!important;color:rgba(255,255,255,.75)!important}
.btn.is-busy:before{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(100deg,transparent 0 20%,rgba(255,255,255,.38) 50%,transparent 80%) 0 0/220% 100% no-repeat;animation:fillwave 1.25s var(--ease) infinite}
.btn.is-busy:after{content:"";position:absolute;inset:-4px;border-radius:inherit;padding:2.5px;background:conic-gradient(from var(--spin,0deg),transparent 0 55%,color-mix(in srgb,var(--accent) 35%,transparent) 78%,var(--accent) 98%,transparent);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);animation:ringspin 1.1s linear infinite}
@property --spin{syntax:"<angle>";inherits:false;initial-value:0deg}
@keyframes ringspin{to{--spin:360deg}}
@keyframes fillwave{from{background-position:130% 0}to{background-position:-130% 0}}
@media(prefers-reduced-motion:reduce){*:not(.is-busy):not(.is-busy *){animation:none!important;transition:none!important}}

/* ===== v3: no zoom, sticky title bar, nav blur, lock screen, chat, wishes, celebration tiles ===== */
html,body{touch-action:pan-x pan-y;-webkit-text-size-adjust:100%}
#app>.bar{position:sticky;top:0;z-index:15;display:flex;align-items:center;gap:10px;min-height:58px;background:var(--page);margin:0 -16px;padding:calc(8px + env(safe-area-inset-top)) 16px 6px;transition:box-shadow .3s}
#app.wide>.bar{margin:0}
#app>.bar h1{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transform-origin:left center;transition:transform .45s var(--ease)}
body.scrolled #app>.bar{box-shadow:0 .5px 0 var(--sep)}
body.scrolled #app>.bar h1{transform:scale(.7)}
#app>.sub{font-size:15px;line-height:20px;color:var(--muted);letter-spacing:-.23px;margin:0 0 10px}
#app.wide>.sub{padding:0 16px}
.tb{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;position:relative;flex:none}
.tb svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.badge{position:absolute;top:-3px;right:-3px;min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:var(--red);color:#fff;font-size:12px;line-height:19px;font-weight:700;font-style:normal;letter-spacing:0;text-align:center}
.badge[hidden]{display:none}
.srow .badge{position:static;margin-left:auto}
#navblur{position:fixed;left:0;right:0;bottom:0;height:calc(118px + env(safe-area-inset-bottom) * .4);z-index:19;pointer-events:none;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);-webkit-mask-image:linear-gradient(to top,#000 45%,transparent);mask-image:linear-gradient(to top,#000 45%,transparent);background:linear-gradient(to top,color-mix(in srgb,var(--page) 80%,transparent),transparent)}
#navblur[hidden],.nav.off{display:none}
@media(min-width:900px){#navblur{display:none}#app.shell>.bar{margin:0 auto;padding:22px 0 8px}#app.shell.wide>.bar{padding-left:40px;padding-right:40px}#app.shell.wide>.sub{padding:0 40px}#app>.bar .tb.me{display:none}}
/* busy buttons: one even, continuous motion */
.btn.is-busy:before{animation:fillwave 1.5s linear infinite;background-size:300% 100%}
.btn.is-busy:after{animation:ringspin 1.4s linear infinite}
@keyframes fillwave{from{background-position:150% 0}to{background-position:-50% 0}}
.btn,.chip,.habit,.opt,.x,.nav button,.srow,.seg button,.tc,.who button,.tb{transition:transform .35s cubic-bezier(.4,0,.2,1),background-color .35s cubic-bezier(.4,0,.2,1),opacity .3s}
/* lock screen (as in Orbit) */
.lock{position:fixed;inset:0;z-index:100;display:flex;overflow-x:hidden;overflow-y:auto;background:var(--page);touch-action:manipulation}
.lock-bg{position:fixed;inset:-20% -20% calc(-20% - 200px);pointer-events:none;filter:blur(60px);opacity:.9}
.lock-bg i{position:absolute;border-radius:50%;display:block}
.lock-bg i:nth-child(1){width:70vmax;height:70vmax;left:5%;top:-10%;background:color-mix(in srgb,#0088FF 34%,transparent);animation:drift1 18s ease-in-out infinite alternate}
.lock-bg i:nth-child(2){width:55vmax;height:55vmax;right:-5%;top:10%;background:color-mix(in srgb,#FFCC00 30%,transparent);animation:drift2 22s ease-in-out infinite alternate}
.lock-bg i:nth-child(3){width:50vmax;height:50vmax;left:20%;bottom:-15%;background:color-mix(in srgb,#FF2D55 20%,transparent);animation:drift3 26s ease-in-out infinite alternate}
@keyframes drift1{to{transform:translate(18vw,14vh) scale(1.15)}}
@keyframes drift2{to{transform:translate(-22vw,20vh) scale(.9)}}
@keyframes drift3{to{transform:translate(10vw,-24vh) scale(1.1)}}
.lock-card{position:relative;z-index:1;width:100%;max-width:360px;margin:0 auto;display:flex;flex-direction:column;text-align:center;min-height:100%;padding:calc(env(safe-area-inset-top) + max(28px,8vh)) 12px calc(env(safe-area-inset-bottom) + max(18px,4vh))}
.lock-scene{display:flex;flex-direction:column;flex:1;animation:scene .55s var(--ease) both}
.lock-scene.back-in{animation-name:scene-back}
@keyframes scene{from{opacity:0;transform:translateX(36px)}}
@keyframes scene-back{from{opacity:0;transform:translateX(-36px)}}
.ident{position:relative;width:84px;height:84px;margin:0 auto 14px;flex:none}
.ident .av,.ident .app-ic{position:relative;z-index:1;width:84px!important;height:84px!important}
.ident .app-ic{border-radius:24px;display:block;object-fit:cover;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.ripple{position:absolute;inset:0;border-radius:50%;border:1.5px solid color-mix(in srgb,var(--accent) 60%,transparent);background:color-mix(in srgb,var(--accent) 8%,transparent);animation:ripple 3.6s cubic-bezier(.2,.6,.3,1) infinite;pointer-events:none}
.ripple:nth-child(2){animation-delay:1.2s}.ripple:nth-child(3){animation-delay:2.4s}
@keyframes ripple{0%{transform:scale(1);opacity:.7}100%{transform:scale(2.8);opacity:0}}
.lock h1{font-size:24px;line-height:30px;font-weight:600;letter-spacing:-.3px}
.lock .hello-s{font-size:15px;color:var(--muted);letter-spacing:-.23px;margin:0 0 2px}
.lock p.sub{margin:6px 0 0;font-size:15px;line-height:20px;letter-spacing:-.23px;color:var(--muted)}
.lock .back{position:absolute;left:0;top:calc(env(safe-area-inset-top) + 10px);z-index:2;display:flex;align-items:center;gap:2px;color:var(--accent);font-size:17px;height:44px;padding:0 10px 0 4px;border-radius:999px}
.lock .back svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.lock .form{display:flex;flex-direction:column;gap:10px;margin-top:22px;text-align:left}
.lock .form input{background:var(--glass);-webkit-backdrop-filter:blur(16px) saturate(180%);backdrop-filter:blur(16px) saturate(180%);box-shadow:inset 0 0 0 .5px var(--rim)}
.lock .form input:focus{box-shadow:inset 0 0 0 .5px var(--rim),0 0 0 2px var(--accent)}
.lock .form label{margin:6px 16px 0}
.lock .actions{display:flex;flex-direction:column;gap:10px;margin-top:22px}
.lock .btn.soft{background:var(--glass);color:var(--ink);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);box-shadow:inset 0 0 0 .5px var(--rim)}
.lock .who{margin:22px 0 4px}
.lock .who button{background:var(--glass);-webkit-backdrop-filter:blur(16px) saturate(180%);backdrop-filter:blur(16px) saturate(180%);box-shadow:inset 0 0 0 .5px var(--rim)}
.pin-dots{display:flex;justify-content:center;gap:22px;margin:28px 0 8px;min-height:14px}
.pin-dots i{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--ink);transition:background .12s}
.pin-dots i.on{background:var(--ink)}
.pin-dots.shake{animation:shake .45s}
@keyframes shake{15%,55%{transform:translateX(-12px)}35%,75%{transform:translateX(12px)}}
.pin-msg{min-height:20px;font-size:15px;line-height:20px;color:var(--muted);margin-bottom:10px;letter-spacing:-.23px;transition:transform .7s var(--ease)}
.pin-msg.neg{color:var(--red)}
.lock.checking .pin-msg{transform:translateY(150px)}
.keypad{display:grid;grid-template-columns:repeat(3,78px);gap:16px 26px;justify-content:center;margin-top:auto;padding-top:16px;transition:transform .6s var(--ease),opacity .4s}
.lock.checking .keypad{transform:translateY(70%);opacity:0;pointer-events:none}
.lock.checking #pinok{opacity:0}
.keypad button{width:78px;height:78px;border-radius:50%;font-size:34px;font-weight:400;display:flex;align-items:center;justify-content:center;line-height:1;position:relative;transition:background .2s;background:var(--glass);-webkit-backdrop-filter:blur(16px) saturate(180%);backdrop-filter:blur(16px) saturate(180%);box-shadow:inset 0 0 0 .5px var(--rim);letter-spacing:0}
.keypad button:active{background:var(--fill)}
.keypad button.fn{background:none;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none;font-size:17px;letter-spacing:-.43px}
.lock.leaving{pointer-events:none;animation:lockout .5s var(--ease) forwards}
@keyframes lockout{to{opacity:0;transform:scale(1.06);filter:blur(10px)}}
/* celebration tile (as in Hearts) */
.bday{position:relative;overflow:hidden;border-radius:26px;padding:16px 18px;margin:10px 0;color:#fff;background:linear-gradient(135deg,#FF2D55,#FF8D28);width:100%;text-align:left;display:block}
.bday.anniv{background:linear-gradient(135deg,#6155F5,#CB30E0)}
.bday .ey{font-size:13px;line-height:18px;font-weight:600;letter-spacing:.2px;text-transform:uppercase;opacity:.92}
.bday .bd-nm{font-size:22px;line-height:28px;font-weight:700;letter-spacing:-.26px}
.bday .bd-sub{font-size:15px;line-height:20px;opacity:.9}
.bday .bd-note{margin:10px 0 0;font-size:15px;line-height:20px;opacity:.95}
.bday .av{box-shadow:0 0 0 3px rgba(255,255,255,.55)}
.bday .bd-in{position:relative;z-index:1}
.bln{position:absolute;right:var(--x);top:var(--y);font-size:var(--s,34px);opacity:.9;animation:float var(--d,5s) ease-in-out infinite alternate;pointer-events:none}
@keyframes float{from{transform:translateY(6px) rotate(-6deg)}to{transform:translateY(-10px) rotate(7deg)}}
/* chat */
.gav{border-radius:50%;display:inline-flex;align-items:center;justify-content:center;flex:none;background:linear-gradient(135deg,#34C759,#00C0E8);font-size:22px}
.crow{padding:9px 0!important;width:100%;text-align:left}
.crow .pv{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted);font-size:15px;line-height:20px}
.crow:after{content:none}
.crow .badge{position:static}
#app.inthread{padding-bottom:0}
#msgs{display:flex;flex-direction:column;gap:3px;padding:8px 0 14px;min-height:calc(100vh - 190px);min-height:calc(100dvh - 190px);justify-content:flex-end}
.day{align-self:center;font-size:12px;line-height:16px;color:var(--muted);font-weight:600;margin:12px 0 6px}
.msg{max-width:78%;padding:8px 13px;border-radius:19px;background:var(--card);align-self:flex-start;white-space:pre-wrap;overflow-wrap:anywhere;animation:msgin .4s var(--ease) both}
.msg.me{align-self:flex-end;background:var(--accent);color:#fff}
.msg.first{margin-top:8px}
.who-l{font-size:12px;line-height:16px;color:var(--muted);margin:8px 0 1px 13px;font-weight:600}
.msg small{display:block;font-size:11px;line-height:13px;opacity:.6;margin-top:2px;text-align:right;letter-spacing:0}
@keyframes msgin{from{opacity:0;transform:translateY(8px) scale(.97)}}
.composer{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom) * .6);display:flex;align-items:center;gap:6px;border-radius:1000px;padding:5px 5px 5px 8px;margin-bottom:10px;z-index:16}
.composer input[type=text]{background:transparent;min-height:40px;padding:8px 10px;box-shadow:none!important;flex:1}
.composer .send{width:38px;height:38px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.composer .send svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
/* wishes */
.wbar{height:10px;border-radius:5px;background:var(--fill3);overflow:hidden;margin:0 0 6px}
.wbar i{display:block;height:100%;border-radius:5px;background:var(--c,var(--accent));transition:width .9s cubic-bezier(.34,1.15,.64,1)}
.wish.got{opacity:.75}
[hidden]{display:none!important}
.msg{animation:none}.msg.new{animation:msgin .4s var(--ease) both}
.seg.four button{font-size:13px}
</style>

<body>
<div id="banner"></div>
<div id="app"></div>
<aside id="side" hidden></aside>
<div id="navblur" hidden></div>
<nav class="nav" id="nav" hidden><div class="glass"></div></nav>
<div id="sheetWrap" onclick="if(event.target===this)closeSheet()"><div id="sheet"></div></div>
<div id="toast"></div>
<div id="syncbar"></div>
<script>
/* ============ SETTINGS: change these two lines ============ */
const CONFIG = {
  API_URL: 'https://script.google.com/macros/s/AKfycbwdczETJa_ogzocppDe4Wzh7Mbuz95D9_I6tLVxyYLhc7QYu5dYVFeYo2eNlDYbf8rJ/exec',   // the Web app URL from Google Apps Script (ends in /exec)
  APP_NAME: 'Kinship',
  ONESIGNAL_APP_ID: ''   // optional here: it is normally read from the Settings tab of the Google Sheet
};
/* ========================================================== */
const DEMO = !/^https:\/\/script\.google(usercontent)?\.com\//.test(CONFIG.API_URL);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const LS = {
  get(k){ try { return JSON.parse(localStorage.getItem('fam_' + k)); } catch(e){ return null; } },
  set(k, v){ try { localStorage.setItem('fam_' + k, JSON.stringify(v)); } catch(e){} },
  del(k){ try { localStorage.removeItem('fam_' + k); } catch(e){} }
};
const st = { token:null, db:null, tab:'home', seg:'today', kidId:null, zoom:1, code:'', feedN:20, quiz:null, meet:null, login:{step:'code'} };
const TABLES = ['members','posts','comments','reactions','events','habits','logs','rewards','redemptions','answers'];

const COUNTRIES = [['India','IN','Asia/Kolkata'],['United Arab Emirates','AE','Asia/Dubai'],['Philippines','PH','Asia/Manila'],['United Kingdom','GB','Europe/London'],['United States','US','America/New_York'],['Canada','CA','America/Toronto'],['Australia','AU','Australia/Sydney'],['New Zealand','NZ','Pacific/Auckland'],['Singapore','SG','Asia/Singapore'],['Saudi Arabia','SA','Asia/Riyadh'],['Qatar','QA','Asia/Qatar'],['Oman','OM','Asia/Muscat'],['Kuwait','KW','Asia/Kuwait'],['Bahrain','BH','Asia/Bahrain'],['Germany','DE','Europe/Berlin'],['France','FR','Europe/Paris'],['Spain','ES','Europe/Madrid'],['Italy','IT','Europe/Rome'],['Netherlands','NL','Europe/Amsterdam'],['Ireland','IE','Europe/Dublin'],['Portugal','PT','Europe/Lisbon'],['Switzerland','CH','Europe/Zurich'],['South Africa','ZA','Africa/Johannesburg'],['Kenya','KE','Africa/Nairobi'],['Malaysia','MY','Asia/Kuala_Lumpur'],['Sri Lanka','LK','Asia/Colombo'],['Nepal','NP','Asia/Kathmandu'],['Pakistan','PK','Asia/Karachi'],['Bangladesh','BD','Asia/Dhaka'],['Japan','JP','Asia/Tokyo'],['Hong Kong','HK','Asia/Hong_Kong'],['Thailand','TH','Asia/Bangkok'],['Indonesia','ID','Asia/Jakarta']];
const cInfo = n => COUNTRIES.find(c => c[0] === n);
const flag = n => { const c = cInfo(n); return c ? String.fromCodePoint(...[...c[1]].map(ch => 127397 + ch.charCodeAt(0))) : '🌍'; };
const QUESTIONS = ['What made you laugh this week?','What is your favourite thing to eat at a family party?','If all the cousins could go on one trip together, where should we go?','What is one thing you are really good at?','What game should we all play together next time?','What is the best thing about where you live?','Which animal would you love as a pet, and why?','What is something new you learned this month?','What is your favourite family memory?','What do you want to be when you grow up?','What song should be our family song?','What would you cook for the whole family?'];

/* ---------- API ---------- */
async function api(action, payload = {}){
  if (DEMO) return demoApi(action, payload);
  let j;
  try {
    const r = await fetch(CONFIG.API_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({ action, token: st.token, ...payload }) });
    j = await r.json();
  } catch(e){ throw new Error('No connection. Please try again.'); }
  if (!j.ok){ if (/session/i.test(j.error)) signOut(true); throw new Error(j.error); }
  return j.data;
}
const normDb = d => { if (d){ d.messages = d.messages || []; d.wishes = d.wishes || []; } return d; };
function useData(d){ normDb(d); st.msgSince = d.messages.reduce((x, m) => Math.max(x, Number(m.ts) || 0), 0); st.db = d; LS.set('db', d); if (d.settings && d.settings.appName) document.title = d.settings.appName; pushLogin(); render(); }
let syncing = null;
function sync(){
  if (syncing) return syncing;
  $('#syncbar').classList.add('on');
  syncing = api('sync', { appUrl: location.href.split(/[?#]/)[0] }).then(useData).finally(() => { syncing = null; $('#syncbar').classList.remove('on'); });
  return syncing;
}
async function save(table, row){
  const arr = st.db[table.toLowerCase()];
  if (!row.id) row.id = uid();
  const i = arr.findIndex(x => x.id === row.id);
  const merged = { ts:String(Date.now()), by:st.db.me, ...(i >= 0 ? arr[i] : {}), ...row };
  if (i >= 0) arr[i] = merged; else arr.push(merged);
  render();
  try { Object.assign(merged, await api('put', { table, row: merged })); LS.set('db', st.db); }
  catch(e){ toast(e.message); try { await sync(); } catch(_){} throw e; }
  return merged;
}
async function removeRow(table, id){
  const k = table.toLowerCase();
  st.db[k] = st.db[k].filter(x => x.id !== id); render();
  try { await api('del', { table, id }); LS.set('db', st.db); } catch(e){ toast(e.message); try { await sync(); } catch(_){} }
}

/* One submit at a time: locks the form and its button until the server answers. */
async function busy(ev, fn, label){
  if (ev && ev.preventDefault) ev.preventDefault();
  const f = ev && ev.target ? ev.target.closest('form') || ev.target : null, b = f ? (f.matches('button') ? f : f.querySelector('button:not([type=button])')) : null;
  if (f && f.dataset.busy) return;
  const old = b ? b.innerHTML : '';
  if (f) f.dataset.busy = '1';
  if (b){ b.classList.add('is-busy'); b.disabled = true; if (label) b.textContent = label; }
  try { await fn(); } catch(e){ toast(e.message || 'Something went wrong'); }
  finally { if (f) delete f.dataset.busy; if (b && b.isConnected){ b.classList.remove('is-busy'); b.disabled = false; b.innerHTML = old; Motion.arm(b.parentNode); } }
}

/* ---------- helpers ---------- */
const M = id => id ? st.db.members.find(m => m.id === id) : null;
const me = () => M(st.db.me) || {};
const first = m => m ? (m.nick || String(m.name || '').split(' ')[0]) : '';
const isKid = m => m && m.role === 'kid';
const isAdmin = () => me().role === 'admin';
const spouseOf = m => m ? (M(m.spouseId) || st.db.members.find(x => x.spouseId === m.id) || null) : null;
const parentsOf = m => m ? [M(m.fatherId), M(m.motherId)].filter(Boolean) : [];
const byBirth = (a, b) => String(a.birth || '9').localeCompare(String(b.birth || '9')) || String(a.name).localeCompare(String(b.name));
const childrenOf = m => st.db.members.filter(c => c.fatherId === m.id || c.motherId === m.id).sort(byBirth);
const isParentOf = (p, k) => !!k && (k.fatherId === p.id || k.motherId === p.id);
const canEdit = m => m.id === me().id || isAdmin() || isParentOf(me(), m);   // self, parents, family admin
const roleFor = birth => { if (!/^\d{4}-\d{2}-\d{2}$/.test(birth || '')) return 'adult'; const b = pDate(birth), n = new Date(); let a = n.getFullYear() - b.getFullYear(); if (n < new Date(n.getFullYear(), b.getMonth(), b.getDate())) a--; return a < 18 ? 'kid' : 'adult'; };
const pad = n => String(n).padStart(2, '0');
const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const today = () => ymd(new Date());
const pDate = s => { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, m - 1, d); };
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const age = m => { if (!m.birth) return null; const b = pDate(m.birth), n = new Date(); let a = n.getFullYear() - b.getFullYear(); if (n < new Date(n.getFullYear(), b.getMonth(), b.getDate())) a--; return a; };
const timeIn = tz => { try { return new Intl.DateTimeFormat([], { hour:'numeric', minute:'2-digit', timeZone: tz || undefined }).format(new Date()); } catch(e){ return ''; } };
const dayIn = tz => { try { return new Intl.DateTimeFormat([], { weekday:'short', timeZone: tz || undefined }).format(new Date()); } catch(e){ return ''; } };
const ago = ts => { const s = (Date.now() - Number(ts)) / 1000; if (s < 60) return 'just now'; if (s < 3600) return Math.floor(s/60) + ' min ago'; if (s < 86400) return Math.floor(s/3600) + ' h ago'; if (s < 604800) return Math.floor(s/86400) + ' d ago'; const d = new Date(Number(ts)); return d.getDate() + ' ' + MON[d.getMonth()]; };
const PAL = ['#FF383C','#FF8D28','#FFCC00','#34C759','#00C8B3','#00C3D0','#00C0E8','#0088FF','#6155F5','#CB30E0','#FF2D55','#AC7F5E'];
const AVP = ['#FF383C','#FF8D28','#34C759','#00C8B3','#00C0E8','#0088FF','#6155F5','#CB30E0','#FF2D55'];
const IOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const hue = s => { let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) % 360; return h; };
const colorOf = id => AVP[hue(id) % AVP.length];
function av(m, size = 44){
  if (!m) return '';
  const cls = 'av' + (m.passed ? ' passed' : '');
  if (m.avatar) return `<img class="${cls}" src="${esc(m.avatar)}" style="width:${size}px;height:${size}px" alt="">`;
  const ini = String(m.name || '?').split(' ').map(w => w[0]).slice(0, 2).join('').toUpperCase();
  return `<span class="${cls}" style="width:${size}px;height:${size}px;font-size:${Math.round(size*.38)}px;background:linear-gradient(color-mix(in srgb,${colorOf(m.id || m.name)} 62%,#fff),${colorOf(m.id || m.name)})">${esc(ini)}</span>`;
}
function toast(t){ const el = $('#toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), 2600); }
function compress(file, max, q){
  return new Promise((res, rej) => { const img = new Image(); img.onload = () => { const s = Math.min(1, max / Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(img.src); res(c.toDataURL('image/jpeg', q)); }; img.onerror = () => rej(new Error('Could not read that photo')); img.src = URL.createObjectURL(file); });
}
function squareAvatar(file){
  return new Promise((res, rej) => { const img = new Image(); img.onload = () => { const s = Math.min(img.width, img.height), c = document.createElement('canvas'); c.width = c.height = 128; c.getContext('2d').drawImage(img, (img.width - s)/2, (img.height - s)/2, s, s, 0, 0, 128, 128); res(c.toDataURL('image/jpeg', .62)); }; img.onerror = () => rej(new Error('Could not read that photo')); img.src = URL.createObjectURL(file); });
}

/* ---------- photo cache (IndexedDB) ---------- */
const photoMem = new Map();
const idb = new Promise(res => { try { const r = indexedDB.open('fam_photos', 1); r.onupgradeneeded = () => r.result.createObjectStore('p'); r.onsuccess = () => res(r.result); r.onerror = () => res(null); } catch(e){ res(null); } });
async function getPhoto(id){
  if (photoMem.has(id)) return photoMem.get(id);
  const p = (async () => {
    const db = await idb;
    if (db){ const hit = await new Promise(r => { const q = db.transaction('p').objectStore('p').get(id); q.onsuccess = () => r(q.result); q.onerror = () => r(null); }); if (hit) return hit; }
    const d = (await api('img', { id })).dataUrl;
    if (db && d) try { db.transaction('p', 'readwrite').objectStore('p').put(d, id); } catch(e){}
    return d;
  })();
  photoMem.set(id, p); return p;
}
function loadPhotos(){ document.querySelectorAll('img[data-photo]').forEach(el => { const id = el.dataset.photo; el.removeAttribute('data-photo'); getPhoto(id).then(d => { if (d) el.src = d; }).catch(() => {}); }); }


/* ---------- Motion: screen transitions, haptics, confetti (modelled on Orbit) ---------- */
const Motion = (() => {
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches, SETTLE = 'cubic-bezier(.32,.72,0,1)';
  const anim = (el, frames, opts) => (reduce || !el || !el.animate ? null : el.animate(frames, opts));
  const M = { enter: false, ringFrom: null };
  M.bounce = el => anim(el, [{ transform:'scale(1)' }, { transform:'scale(1.3)', offset:.45 }, { transform:'scale(1)' }], { duration:520, easing:SETTLE });
  M.haptic = () => { try { if (!IOS && navigator.vibrate) navigator.vibrate(8); } catch(e){} };
  const HAPTIC = '.btn, .nav button, .srow, .seg button, .habit, button.chip, .opt, .x, .acts button, .who button, .top .bar button';
  M.arm = root => { if (!IOS || !root) return; root.querySelectorAll(HAPTIC).forEach(el => {
    if (el.querySelector(':scope > [data-haptic]')) return;
    const lb = document.createElement('label'); lb.setAttribute('data-haptic', ''); lb.setAttribute('aria-hidden', 'true');
    const sw = document.createElement('input'); sw.type = 'checkbox'; sw.setAttribute('switch', ''); sw.tabIndex = -1; sw.addEventListener('click', e => e.stopPropagation());
    lb.appendChild(sw); if (getComputedStyle(el).position === 'static') el.style.position = 'relative'; el.appendChild(lb); }); };
  M.after = () => {
    const app = document.getElementById('app');
    if (M.enter){ M.enter = false; let n = 0; Array.from(app.children).filter(el => !el.classList.contains('bar') && !el.classList.contains('composer')).flatMap(el => el.classList.contains('clocks') || el.classList.contains('stats') ? Array.from(el.children) : [el]).forEach(el => { if (el.getBoundingClientRect().top > innerHeight + 40) return; anim(el, [{ opacity:0, transform:'translateY(14px) scale(.985)' }, { opacity:1, transform:'none' }], { duration:460, delay:Math.min(n++, 7) * 32, easing:SETTLE, fill:'backwards' }); }); }
    const prg = app.querySelector('.prg');
    if (prg){ const C = 2 * Math.PI * 30, to = +prg.dataset.pct; if (M.ringFrom != null && M.ringFrom !== to) anim(prg, [{ strokeDashoffset:C * (1 - M.ringFrom) }, { strokeDashoffset:C * (1 - to) }], { duration:650, easing:SETTLE }); M.ringFrom = to; } else M.ringFrom = null;
    M.arm(app); M.arm(document.getElementById('nav')); M.arm(document.getElementById('side'));
  };
  M.confetti = () => { if (reduce) return; for (let i = 0; i < 36; i++){ const d = document.createElement('div'); d.className = 'cf'; d.style.left = (8 + Math.random() * 84) + 'vw'; d.style.background = PAL[i % PAL.length]; document.body.appendChild(d);
    d.animate([{ transform:'translateY(0) rotate(0)', opacity:1 }, { transform:`translate(${(Math.random() - .5) * 160}px,${innerHeight * (.55 + Math.random() * .4)}px) rotate(${Math.random() * 720}deg)`, opacity:0 }], { duration:1300 + Math.random() * 900, delay:Math.random() * 250, easing:'cubic-bezier(.2,.6,.4,1)', fill:'forwards' }).onfinish = () => d.remove(); } };
  return M;
})();

/* ---------- relationships ---------- */
function ancestors(id){ const out = new Map([[id, 0]]); const q = [id]; while (q.length){ const c = q.shift(), m = M(c); if (!m) continue; for (const p of [m.fatherId, m.motherId]) if (p && M(p) && !out.has(p)){ out.set(p, out.get(c) + 1); q.push(p); } } return out; }
function blood(a, b){ const A = ancestors(a), B = ancestors(b); let best = null; for (const [id, da] of A) if (B.has(id)){ const db = B.get(id); if (!best || da + db < best[0] + best[1]) best = [da, db]; } return best; }
const ORD = ['','','second ','third ','fourth '];
function bloodName(da, db, g){
  const f = g === 'female', mm = g === 'male', pick = (a, b, c) => f ? a : mm ? b : c;
  const gr = n => n <= 0 ? '' : n === 1 ? 'grand' : 'great-'.repeat(n - 1) + 'grand';
  if (da === 0 && db === 0) return 'you';
  if (db === 0) return gr(da - 1) + pick('mother', 'father', 'parent');
  if (da === 0) return gr(db - 1) + pick('daughter', 'son', 'child');
  if (da === 1 && db === 1) return pick('sister', 'brother', 'sibling');
  if (db === 1) return (da > 2 ? gr(da - 2).replace('grand', 'great-') : '') + pick('aunt', 'uncle', 'aunt/uncle');
  if (da === 1) return (db > 2 ? gr(db - 2).replace('grand', 'great-') : '') + pick('niece', 'nephew', 'niece/nephew');
  const deg = Math.min(da, db) - 1, rem = Math.abs(da - db);
  return (ORD[deg] ?? deg + 'th ') + 'cousin' + (rem === 1 ? ' once removed' : rem === 2 ? ' twice removed' : rem ? ` ${rem}× removed` : '');
}
function relation(bId){
  const a = me(), b = M(bId); if (!b || !a.id) return '';
  if (a.id === b.id) return 'you';
  let r = blood(a.id, b.id); if (r) return bloodName(r[0], r[1], b.gender);
  const sa = spouseOf(a), sb = spouseOf(b), g = b.gender;
  if (sa && sa.id === b.id) return g === 'female' ? 'wife' : g === 'male' ? 'husband' : 'spouse';
  if (sa && (r = blood(sa.id, b.id))){ const n = bloodName(r[0], r[1], g); if (/niece|nephew/.test(n)) return n; return /cousin|aunt|uncle|grand/.test(n) && !/^grand(mother|father|parent)$/.test(n) ? n + ' (by marriage)' : n + '-in-law'; }
  if (sb && (r = blood(a.id, sb.id))){
    const [da, db] = r, f = g === 'female';
    if (da === 0 && db === 1) return f ? 'daughter-in-law' : 'son-in-law';
    if (da === 1 && db === 1) return f ? 'sister-in-law' : 'brother-in-law';
    if (db === 1 && da >= 2) return bloodName(da, db, g) + ' (by marriage)';
    return bloodName(da, db, sb.gender) + "'s " + (f ? 'wife' : 'husband');
  }
  if (sa && sb && (r = blood(sa.id, sb.id))) return r[0] === 1 && r[1] === 1 ? (g === 'female' ? 'sister-in-law' : 'brother-in-law') : 'family by marriage';
  return 'family';
}

function nextOcc(s){ const d = pDate(s), n = pDate(today()); let c = new Date(n.getFullYear(), d.getMonth(), d.getDate()); if (c < n) c = new Date(n.getFullYear() + 1, d.getMonth(), d.getDate()); return c; }
function upcoming(){
  const out = [], t0 = pDate(today()), seen = new Set();
  for (const m of st.db.members){
    if (m.birth && !m.passed){ const d = nextOcc(m.birth); const turn = d.getFullYear() - pDate(m.birth).getFullYear(); out.push({ d, emoji:'🎂', title: first(m) + "'s birthday", sub: isKid(m) && turn > 0 ? 'Turning ' + turn : (m.country ? flag(m.country) + ' ' + m.country : ''), mid:m.id }); }
    const sp = spouseOf(m); const an = m.anniv || (sp && sp.anniv);
    if (sp && an && !m.passed && !sp.passed){ const key = [m.id, sp.id].sort().join(); if (!seen.has(key)){ seen.add(key); const d = nextOcc(an); out.push({ d, emoji:'💍', title: first(m) + ' & ' + first(sp) + "'s anniversary", sub: (d.getFullYear() - pDate(an).getFullYear()) + ' years', mid:m.id }); } }

/* ---------- TREE ---------- */
const CW = 92, CH = 112, SG = 8, GAP = 22, LV = 168, TG = 70, PADX = 30, PADY = 54;
function treeModel(){
  const ms = [...st.db.members].sort(byBirth), hasPar = m => parentsOf(m).length > 0;
  const kidsOfUnit = (a, b) => ms.filter(c => [c.fatherId, c.motherId].some(x => x && (x === a.id || (b && x === b.id))));
  const roots = [], used = new Set(), loose = [];
  for (const m of ms){
    if (hasPar(m) || used.has(m.id)) continue;
    const sp = spouseOf(m); if (sp && hasPar(sp)) continue;
    used.add(m.id); if (sp) used.add(sp.id);
    if (!sp && !kidsOfUnit(m).length){ loose.push(m); continue; }
    roots.push(m);
  }
  const mine = new Set(); (function up(m, n){ if (!m || n > 12) return; const ps = parentsOf(m); if (!ps.length) mine.add(m.id); ps.forEach(p => up(p, n + 1)); })(me(), 0);
  roots.sort((a, b) => { const s = r => (mine.has(r.id) || (spouseOf(r) && mine.has(spouseOf(r).id))) ? 0 : 1; return s(a) - s(b); });

    const u = { p, depth, kids: [] };
    if (placed.has(p.id)){ u.stub = true; u.w = CW; return u; }
    placed.set(p.id, u);
    const sp = spouseOf(p); if (sp && !placed.has(sp.id)){ u.sp = sp; placed.set(sp.id, u); }
    const np = new Set(path).add(p.id); if (u.sp) np.add(u.sp.id);
    u.kids = kidsOfUnit(p, u.sp).filter(k => !np.has(k.id)).map(k => build(k, depth + 1, np));
    const self = u.sp ? CW * 2 + SG : CW, kw = u.kids.reduce((s, k) => s + k.w, 0) + GAP * Math.max(0, u.kids.length - 1);
    u.w = Math.max(self, kw); u.kw = kw; return u;
  }
  let x = PADX; const nodes = [], lines = [], links = [], labels = [], pos = {};
  for (const r of roots){
    const t = build(r, 0, new Set());
    let off = 0; (function f(u){ if (u.stub && off === 0 && placed.get(u.p.id).abs != null){ off = placed.get(u.p.id).abs - u.depth; } u.kids.forEach(f); })(t);
    (function place(u, x0){
      u.abs = u.depth + off; u.cx = x0 + u.w / 2;

    const y = Y(u), half = (CW + SG) / 2;

async function demoApi(action, p){
  if (!demoDb) demoDb = seedDemo();
  await new Promise(r => setTimeout(r, 60));
  if (action === 'sync') return JSON.parse(JSON.stringify(demoDb));
  if (action === 'put'){ const a = demoDb[p.table.toLowerCase()], i = a.findIndex(x => x.id === p.row.id); if (i >= 0) a[i] = { ...a[i], ...p.row }; else a.push({ ...p.row }); return p.row; }
  if (action === 'del'){ const k = p.table.toLowerCase(); demoDb[k] = demoDb[k].filter(x => x.id !== p.id); return {}; }
  if (action === 'upload'){ const id = uid(); demoPhotos[id] = p.dataUrl; return { id }; }
  if (action === 'img') return { dataUrl: demoPhotos[p.id] };
  if (action === 'settings'){ Object.assign(demoDb.settings, p); return {}; }
  if (action === 'msgs') return [];
  return {};
}

(async function start(){
  if (DEMO){ st.token = 'demo'; await sync(); return; }
  st.token = LS.get('token');
  if (!st.token){ warmLogin(); render(); return; }
  st.db = normDb(LS.get('db'));
  if (st.db) render();                                   // saved data first: the app opens at once
  else $('#app').innerHTML = `<div class="splash"><img src="icon-192.png" alt=""><div>Opening ${esc(CONFIG.APP_NAME)}…</div></div>`;
  try { await sync(); } catch(e){ if (st.db) toast('Showing saved data. ' + e.message); else { warmLogin(); render(); } }
})();
if ('serviceWorker' in navigator && location.protocol === 'https:') addEventListener('load', () => navigator.serviceWorker.register('OneSignalSDKWorker.js').catch(() => {}));
/* No pinch or double-tap zoom: the app keeps one size, like a native app. */
['gesturestart', 'gesturechange', 'gestureend'].forEach(t => document.addEventListener(t, e => e.preventDefault(), { passive:false }));
document.addEventListener('touchmove', e => { if (e.touches.length > 1) e.preventDefault(); }, { passive:false });
addEventListener('wheel', e => { if (e.ctrlKey) e.preventDefault(); }, { passive:false });
addEventListener('scroll', () => document.body.classList.toggle('scrolled', scrollY > 16), { passive:true });
document.addEventListener('visibilitychange', () => { if (!document.hidden && st.db && !DEMO && !sheetFn && !(st.tab === 'chat' && st.chatWith)) sync().catch(() => {}); else if (!document.hidden) pollMsgs(); });
setInterval(() => { if (st.db && st.tab === 'home' && !sheetFn && !document.hidden) render(); }, 60000);
